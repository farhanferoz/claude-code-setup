# One [[piece]] per installable piece. Data, not code: setupctl reads this file.
# version = the commit the piece was last verified at; empty only for link-only pieces.
# install/check are command lines run in the piece's clone (or as written, for a marketplace).
# Entries marked "inferred" below were not given by the repository's own README.

[[piece]]
name = "ccage"
repo = "farhanferoz/ccage"
version = "384e2d48a9a4567aed087ddbc465698d3ba21b4b"
kind = "ccage"
clone_dir = "ccage"
install = ["./install.sh"]
check = ["ccage --help"]  # inferred
optional = false

[[piece]]
name = "claude-skills"
repo = "farhanferoz/claude-skills"
version = "0b6bad3a76177ca6ae0673158109cef317578850"
kind = "marketplace"
clone_dir = "claude-skills"
install = ["claude plugin marketplace add farhanferoz/claude-skills"]
check = ["claude plugin marketplace list"]  # inferred
optional = false

[[piece]]
name = "tokenol"
repo = "farhanferoz/tokenol"
version = "bb59dc2089ff164f55ce5892af602075833d393a"
kind = "uv-tool"
clone_dir = "claude_rate_limit"
# uv, not pip: pip refuses Ubuntu 24.04's system Python (PEP 668); uv tool install measured 2026-11-22 in ubuntu:24.04.
install = ["uv tool install --editable '.[serve]'"]
check = ["tokenol --help"]  # exits 0 (measured 2026-11-22)
optional = false

[[piece]]
name = "corpus-search"
repo = "farhanferoz/corpus-search"
version = "1eeeeaf7f5763463ba56b24ace17e8b65ba3d2cd"
kind = "uv-tool"
clone_dir = "corpus-search"
install = ["uv tool install --editable ."]  # inferred: README documents only `uv sync` and `uv run`
check = ["corpus-search --help"]  # inferred
optional = false

[[piece]]
name = "localmodels"
repo = "farhanferoz/localmodels"
version = "cb181a7ecc48d17a8f4b7f7ced03e27372cee9d2"
kind = "uv-tool"
clone_dir = "localmodels"
install = ["uv tool install --editable ."]  # inferred: README documents only `uv add localmodels` (library use)
check = ["localmodels --help"]  # inferred
optional = false

[[piece]]
name = "preflight"
repo = "alan-turing-institute/preflight"
version = "1e324eabedfb79a0e197eba83027f0991d2be887"
kind = "link-only"
clone_dir = "turing/preflight"
optional = false

[[piece]]
name = "ogc"
repo = "farhanferoz/ogc"
version = "d32939c8feb0ef8e24da78e764a3c57d9fb4f714"  # remote HEAD; the local clone ~/dev/opencode is on another branch
kind = "link-only"  # inferred: a Go program (README: go install), no manifest kind for Go yet
clone_dir = "opencode"
optional = true

[[piece]]
name = "playwright-agents"
repo = "farhanferoz/playwright-agents"
version = "886bfb3f68824c830b622313c3b7320b32f7a99f"
kind = "marketplace"
clone_dir = "playwright-agents"
install = ["claude plugin marketplace add farhanferoz/playwright-agents", "claude plugin install playwright-agents@playwright-agents"]
