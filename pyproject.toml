[project]
name = "claude-code-setup"
version = "0.1.0"
description = "One-command setup for the Claude Code tools in this umbrella, plus a machine snapshot for regression checks."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
setupctl = "setupctl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["setupctl"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
# A test asserts reviewed literal expectations; PLR2004 would be a false positive there.
"tests/**" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
